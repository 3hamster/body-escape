<html lang="ko">
<head>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Nanum+Pen+Script&family=Song+Myung&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --void:#0b0507; --panel:#1c0d11; --line:#5a2a33; --bone:#f1e6d3; --muted:#b9a39a; --blood:#a3202f; --glow:#ffb4a8; --paper:#e9dcc2; --ink:#2a1a14; --blue:#1b3fd6;

@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --void:#0b0507; --panel:#1c0d11; } }
:root[data-theme="dark"]{ --void:#0b0507; --panel:#1c0d11; }
html,body{height:100%}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--void);color:var(--bone);font-family:var(--body);font-size:17px;line-height:1.65;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;color:inherit;touch-action:manipulation}
body{-webkit-touch-callout:none}
input[type=range]{width:100%;min-height:44px;accent-color:#ff6a6a}
.qrow{display:flex;gap:8px;flex-wrap:wrap}
.qrow .btn.on{background:var(--blood);border-color:#d0495a;color:#fff}
#app{position:relative;width:100%;height:100%;overflow:hidden;touch-action:none}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
#touch{position:absolute;inset:0;z-index:5;touch-action:none}

#pulse.beat{opacity:1}
#fade{position:absolute;inset:0;z-index:40;background:#000;opacity:0;pointer-events:none;transition:opacity .5s}
#fade.on{opacity:1}

.reticle{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:rgba(255,255,255,.35);z-index:7;pointer-events:none}

#hud{position:absolute;left:0;right:0;top:0;z-index:20;display:flex;gap:8px;align-items:flex-start;padding:10px 12px;pointer-events:none}

.place{background:rgba(11,5,7,.72);border:1px solid var(--line);border-radius:14px;padding:4px 14px;line-height:1.4}

#mhint{position:static;min-height:46px;padding:4px 16px;margin:0;background:rgba(255,211,92,.16);border:1px solid #ffd35c;color:#ffd35c;border-radius:14px;font-size:16px;cursor:pointer}
.hb:focus-visible,.btn:focus-visible,.slotI:focus-visible,.arw:focus-visible{outline:3px solid var(--glow);outline-offset:2px}

#joy{position:absolute;left:96px;top:70%;width:132px;height:132px;margin:-66px 0 0 -66px;border-radius:50%;background:rgba(241,230,211,.06);border:2px solid rgba(241,230,211,.22);z-index:15;pointer-events:none;opacity:.5;transition:opacity .15s}

.blue{color:var(--blue);font-weight:700}

.btn:disabled{opacity:.38;cursor:not-allowed}

.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;align-items:center}

@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

.col{display:flex;flex-direction:column;align-items:center;gap:6px}
.arw{width:56px;min-height:44px;border-radius:10px;border:0;background:#cdb26a;color:#3a2a08;font-size:22px;cursor:pointer}

.slots{display:flex;gap:8px;justify-content:center;margin:10px 0}

.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:300px;margin:0 auto}

.waitbox{margin:26px 0;padding:26px 18px;border:1px solid var(--line);border-radius:16px;text-align:center}.waitbox p{margin:10px 0 0}.wdot{width:16px;height:16px;border-radius:50%;background:var(--rose,#d94f6a);margin:0 auto;animation:wpulse 1.4s ease-in-out infinite}.wnum{font-size:96px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}@keyframes wpulse{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.25)}}

.seqrow{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;min-height:50px;margin:8px 0;padding:6px;border-radius:12px;background:#12080b;border:1px solid var(--line)}

.dk.up{grid-column:2;grid-row:1}.dk.lf{grid-column:1;grid-row:2}.dk.rt{grid-column:3;grid-row:2}.dk.dn{grid-column:2;grid-row:3}
.bwrap{position:relative;aspect-ratio:5/4;max-width:430px;margin:10px auto;background:#1a1030;border:3px solid #8a6ad8;border-radius:12px;overflow:hidden}

.sets{display:grid;gap:8px;margin:8px 0}

.wt .dot{width:18px;height:18px;border-radius:50%;border:3px solid #cfd8e8;background:#0b1018;flex:none}
.wsvg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
.bagbtn{position:relative;min-width:96px;min-height:66px;padding:6px 16px;border-radius:16px;background:rgba(11,5,7,.82);border:2px solid #8a6a4a;font-size:17px;display:flex;align-items:center;gap:8px;cursor:pointer}
.bagbtn:active{background:var(--blood)}
.bagcount{position:absolute;right:-7px;top:-9px;min-width:26px;height:26px;padding:0 6px;border-radius:13px;background:var(--blood);color:#fff;font-size:14px;font-style:normal;display:grid;place-items:center}
.selchip{display:flex;align-items:center;gap:8px;padding:4px 12px;border-radius:999px;background:rgba(11,5,7,.88);border:2px solid #ffd35c;font-size:14.5px;cursor:pointer}
.bag{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px;margin:8px 0}

.itemhead{display:flex;gap:16px;align-items:center}

.timer{min-height:46px;min-width:76px;display:grid;place-items:center;padding:0 14px;background:rgba(11,5,7,.72);border:1px solid var(--line);border-radius:14px;font-size:17px;font-variant-numeric:tabular-nums;letter-spacing:.04em}
.heartbox{position:relative;width:min(300px,78vw);aspect-ratio:1;margin:8px auto}
.heartbg{position:absolute;inset:0;width:100%;height:100%}
.hslot{position:absolute;width:38%;height:34%;border:2px dashed rgba(255,120,130,.65);border-radius:14px;background:rgba(255,58,74,.08);display:grid;place-items:center;font-size:16px}

.tray{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center;min-height:68px;padding:8px;border-radius:14px;background:#12080b;border:1px solid var(--line)}

.lockgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}

.bagpane{padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid var(--line)}
.mini{display:flex;flex-wrap:wrap;gap:8px}
.miniitem{min-width:66px;padding:6px 8px;border-radius:10px;border:2px solid var(--line);background:#2a1319;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;cursor:pointer}

.viewer{margin-top:10px;padding:12px;border-radius:12px;background:#e9dcc2;color:#2a1a14;min-height:130px;max-height:46vh;overflow:auto}

.bagbtn.flash{animation:bagflash .7s}

.hb.pulse{animation:hbpulse .8s infinite;border-color:#ffd35c}
@keyframes hbpulse{0%,100%{box-shadow:0 0 0 rgba(255,211,92,0)}50%{box-shadow:0 0 16px rgba(255,211,92,.9)}}
.wheels{display:flex;gap:12px;justify-content:center;margin:14px 0}
.wheel{display:flex;flex-direction:column;align-items:center;gap:6px}
.wl{width:56px;height:64px;display:grid;place-items:center;font-size:36px;font-weight:700;border-radius:12px;background:#12080b;border:2px solid var(--line)}
.wb{width:56px;height:42px;border-radius:12px;border:2px solid #3a7fb8;background:#0f2238;color:#9fd0ff;font-size:20px;cursor:pointer}
.bookview{display:grid;place-items:center;margin:10px 0}
.bk{width:96px;height:132px;border-radius:6px 10px 10px 6px;background:linear-gradient(90deg,#6b8a22,#86a02c 40%,#76922a);border:2px solid #4a6012;display:grid;place-items:center;font-size:50px;font-weight:800;color:#fff7d0;text-shadow:0 2px 0 #3a4a10;position:relative}
.bk::before{content:"";position:absolute;left:0;right:0;top:16px;height:14px;background:#d9b45a}
.rtb{position:relative;--c:min(72px,19vw);width:calc(var(--c) * 4 + 6px);height:calc(var(--c) * 4 + 6px);margin:10px auto 14px;background:#0a1017;border:3px solid #5b7890;border-radius:10px}

.ringdraw{stroke-dasharray:654;stroke-dashoffset:654;animation:wrapdraw .55s cubic-bezier(.2,.8,.2,1) forwards}.ringdraw2{stroke-dasharray:230;stroke-dashoffset:230;animation:wrapdraw2 .5s cubic-bezier(.2,.8,.2,1) forwards}@keyframes wrapdraw2{from{stroke-dashoffset:230}to{stroke-dashoffset:0}}.ringfade{opacity:0;animation:ringfadein .35s .5s forwards}
.ascene{display:block;width:100%;max-width:230px;margin:0 auto}

.bbox{display:flex;align-items:center;justify-content:center;gap:14px;margin:6px 0}

.pg{display:flex;gap:6px;align-items:center;margin-left:auto;font-size:15px;color:#6b4a30}

#screen{position:absolute;inset:0;z-index:50;display:flex;padding:16px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y;background:radial-gradient(ellipse at 50% 30%,#3a0d17 0%,#0b0507 70%);overflow:auto;touch-action:auto}
.card{width:min(620px,100%);text-align:left;margin:auto}
#screen .card::after{content:'';display:block;height:max(28px,env(safe-area-inset-bottom,0px))} /* 맨 아래 버튼이 화면 가장자리에 붙지 않게 */
#app:has(#screen:not([hidden])){touch-action:auto} /* 시작·클리어 화면에서는 손가락으로 위아래 스크롤 */
@media (max-height:620px){#screen{padding:10px}.card h1{font-size:34px}.card .sub{margin-bottom:8px}}
.card h1{font-family:var(--display);font-weight:400;font-size:44px;line-height:1.2;margin:0 0 4px;color:#ffd5cc;text-shadow:0 0 24px var(--blood)}
.card .sub{margin:0 0 14px;color:var(--muted)}
.card ul{margin:10px 0 16px;padding:0;list-style:none;display:grid;gap:8px}
.card li{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:12px;padding:8px 14px;font-size:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:12px 0}
.stat{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.stat b{display:block;font-family:var(--display);font-weight:400;font-size:24px}
.stat span{font-size:13.5px;color:var(--muted)}
.recap{display:grid;gap:6px;margin:8px 0;font-size:15.5px}
.recap div{background:rgba(255,255,255,.05);border-radius:10px;padding:6px 12px}
.recap b{color:var(--glow)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

.total{text-align:center;margin:12px 0;padding:14px 10px;border:2px solid var(--glow);border-radius:14px;background:rgba(255,211,92,.08)}
.total span{display:block;font-size:15px;opacity:.85}
.total b{display:block;font-size:44px;letter-spacing:.04em;color:#ffd35c;line-height:1.2}
.total small{display:block;font-size:13px;opacity:.7}
.story{background:rgba(255,255,255,.05);border-left:3px solid var(--glow);border-radius:8px;padding:6px 14px;margin:8px 0 12px;font-size:15.5px;line-height:1.6}
.story p{margin:6px 0}

letter lock is attached to the wall.", "벽에 적힌 글": "Writing on the wall", "?에 들어갈 말을 직접 적어 보자.": "Write what goes in the ? yourself.", "문이 열려 있다.": "The door is open.", "문의 자물쇠": "Door lock", "문에 세 자리 숫자 자물쇠가 달려 있다.": "A three-digit number lock is attached to the door.", "철컥… 자물쇠가 풀렸다.": "Click… The lock came undone.", "문이 열렸다. 안쪽에 무언가가 있다.": "The door opened. There's something inside.", "철컥… 환풍구의 자물쇠가 풀렸다.": "Click… The vent's lock came undone.", "환풍구가 열렸다. 안으로 들어가면 다음 방으로 이동한다.": "The vent opened. If you go inside, you'll move to the next room.", "쇠창살에 열쇠 구멍이 달려 있다. 안쪽으로 노란 관이 길게 이어져 있다.": "The grating has a keyhole. A long yellow tube stretches inside.", "인체모형이 문 앞을 가로막고 있다.": "The mannequin is blocking the door.", "문의 방향 자물쇠": "Door direction lock", "문에 방향 자물쇠가 달려 있다.": "A direction lock is attached to the door.", "글자 떼어 내기": "Peel off the letter", "문에 붙어 있던 L을 떼어 냈다. ㄱ자로 꺾인 단단한 막대다.": "You peeled off the L that was stuck on the door. It's a hard rod bent into an L shape.", "글자가 단단히 붙어 있다.": "The letter is stuck on firmly.", "서랍장 위에 노트가 놓여 있다.": "A notebook sits on top of the dresser.", "바닥의 종이": "Paper on the floor", "인체모형이 서 있던 자리에 종이 한 장이 놓여 있다.": "A sheet of paper lies where the mannequin stood.", "서랍이 비어 있다.": "The drawer is empty.", "붉은 혈관": "Red blood vessel", "굵은 붉은 혈관이 벽을 따라 천장까지 곧게 솟아 있다.": "A thick red blood vessel rises straight up the wall to the ceiling.", "푸른 혈관": "Blue blood vessel", "ㄱ자 막대를 뻗어 보아도 닿지 않는다.": "Even if you stretch the L rod out, it doesn't reach.", "굵은 푸른 혈관이 천장까지 곧게 솟아 있다. 높은 곳에 심장 조각이 끼어 있다. 손이 닿지 않는다.": "A thick blue blood vessel rises straight to the ceiling. A heart piece is stuck high up. You can't reach it.", "굵은 푸른 혈관이 벽을 따라 천장까지 곧게 솟아 있다.": "A thick blue blood vessel rises straight up the wall to the ceiling.", "비어 있다.": "It's empty.", "혈관에서 떨어진 심장 조각이다. 우심방이다.": "A heart piece that fell from the vessel. It's the right atrium.", "우심방 꺼내기": "Take the right atrium", "탁자 위의 초록색 덩어리는 세균이 번식한 것이다. 꿈틀거리며 퍼지고 있고, 독이 있는 것 같아 손으로 만질 rame.", "시약장은 이미 열려 있다.": "The reagent cabinet is already open.", "유리문이 잠겨 있어 꺼낼 수 없다.": "The glass door is locked, so you can't take anything out.", "카페트는 이미 한쪽 벽으로 말려 올라가 있다.": "The carpet has already been rolled up against one wall.", "혀 모양 카페트": "Tongue-shaped carpet", "혀 모양 카페트의 한쪽 구석에 작은 손잡이가 달려 있다. 무겁고 축축하지만, 잡고 들어 올리면 밑을 볼 수 있을 것 같다.": "There's a small handle at one corner of the tongue-shaped carpet. It's heavy and damp, but if you hold it and lift, you might see what's underneath.", "카페트 들어 올리기": "Lift the carpet", "이미 열려 있다.": "It's already open.", "상자는 비어 있다.": "The box is empty.", "낡은 가위": "Old scissors", "누군가 두고 간 낡은 가위. 날은 아직 날카롭다.": "Old scissors someone left behind. The blades are still sharp.", "가래떡은 이미 녹아 버렸다.": "The rice cake has already melted.", "가위로 가래떡 자르기": "Cut the rice cake with scissors", "가위날이 떡에 파고들지 못하고 튕겨 나온다. 떡이 돌덩이처럼 단단해서 잘리지 않는다.": "The blades bounce off the cake without cutting in. The cake is hard as stone and won't be cut.", "설령 자른다 해도 작은 덩어리가 될 뿐이다.": "Even if you cut it, it would only become smaller lumps.", "…이 떡을 아예 녹일 방법은 없을까?": "…Isn't there a way to dissolve this cake entirely?", "가래떡": "Rice cake stick", "길쭉한 가래떡 한 가닥이 놓여 있다. 한쪽 끝으로 종이 한 귀퉁이가 삐져나와 있다. 속에 무언가 말려 있는 모양이다.": "A long stick of rice cake lies here. A corner of paper sticks out of one end. Something seems to be rolled up inside.", "밀어도 꿈쩍하지 않는다. 이 덩어리의 주성분은 녹말이다.": "It doesn't budge when pushed. The main component of this lump is starch.", "이빨로 씹어 본다": "Chew it with the teeth", "이빨로 씹어 봐도 떡은 작아질 뿐 사라지지 않는다. 너무 단단하다.": "Even chewing it with the teeth only makes the cake smaller; it doesn't disappear. It's too hard.", "…떡을 녹일 방법은 없을까? 녹말을 다른 물질로 바꿔 버릴 무언가가 필요하다.": "…Isn't there a way to dissolve the cake? You need something that turns starch into another substance.", "이빨": "Teeth", "벽에서 자란 거대한 이빨. 음식물을 잘게 부수지만 영양소의 종류를 바꾸지는 못한다.": "Giant teeth grown from the wall. They break food into small pieces but don't change the kind of nutrient.", "손톱 자국: “씹는다고 소화가 끝나는 게 아니야. 녹말은 침 속 소화효소가 바꿔 놓지.”": "Scratch marks: \"Chewing doesn't finish digestion. The enzyme in saliva changes starch.\"", "작은창자": "Small intestine", "지방": "Fat", "녹말": "Starch", "찰칵… 바닥의 비밀 문이 열렸다.": "Click… The secret door in the floor opened.", "바닥 문의 배전함": "Floor door junction box", "배선이 끊겨 있다. 소화기관과, 그곳에서 소화가 시작되는 영양소를 전선으로 이어야 전류가 흐른다.": "The wiring is cut. Connect each digestive organ to the nutrient whose digestion starts there with wires for the current to flow.", "전원 켜기": "Turn on power", "다시 연결": "Reconnect", "아직 이어지지 않은 선이 있다.": "There are wires not yet connected.", "전류가 흐른다!": "Current flows!", "합선! 전류가 통하지 않는다.": "Short circuit! The current doesn't pass.", "녹말이 있으면 청람색으로 변한다.": "It turns blue-black if starch is present.", "당(엿당, 포도당 등)이 있으면 가열할 때 황적색으로 변한다.": "It turns orange-red when heated if sugar (maltose, glucose, etc.) is present.", "단백질이 있으면 보라색으로 변한다.": "It turns purple if protein is present.", "지방이 있으면 선홍색으로 변한다.": "It turns bright red if fat is present.", "문을 열기 위한 메뉴판": "Menu to open the door", "왼쪽": "Left", "오른쪽": "Right", "아래": "Down", "문이 열렸다. 문을 통과하면 다음 방으로 이동한다.": "The door opened. Passing through the door moves you to the next room.", "시약장의 방향 자물쇠": "Reagent cabinet direction lock", "시약장이 방향 자물쇠로 잠겨 있다. 위, 아래, 왼쪽, 오른쪽 버튼을 순서대로 눌러 열어야 한다.": "The reagent cabinet is locked with a direction lock. Press the up, down, left and right buttons in order to open it.", "찰칵… 시약장이 열렸다.": "Click… The reagent cabinet opened.", "철컹… 자물쇠가 열리지 않는다. 메뉴판을 다시 읽어 보자.": "Clank… The lock won't open. Let's read the menu again.", "상자의 작은 자물쇠": "Small lock on the box", "시약장 안 가운데 상자에 작은 자물쇠가 채워져 있다. 글자를 돌려 맞추는 자물쇠다. 상자에는 쪽지가 붙어 있다.": "A small lock is on the box in the middle of the reagent cabinet. It's a lock where you turn the letters to match. A note is stuck on the box.", "나는 음식을 좋아하는 대식가. 아침엔 푸짐한 식사를, 점심엔 든든한 간식을, 저녁에는 달콤한 후식을 주문해서 먹어야 배부를껄?": "I'm a big eater who loves food. I'd better order a hearty meal for breakfast, a filling snack for lunch, and a sweet ", "점심시간, 과학실. 과학 선생님이 새로 만든": "Lunchtime in the science room. The science teacher was testing a newly made", "축소 광선": "shrink ray", "을 시험하고 계셨다. 그때 장난기 많은 짝꿍이 손을 뻗었다. “이거 눌러 봐도 돼요?” — 번쩍!": ". Then your mischievous deskmate reached out. \"Can I press this?\" — Flash!", "눈을 떠 보니 우리는 세포만큼 작아져 있었다. 눈앞에는 샌드위치를 크게 베어 물려는 짝꿍의 입. 우리는 빵 부스러기와 함께": "When we opened our eyes, we had shrunk to the size of a cell. In front of us was our deskmate's mouth, about to take a big bite of a sandwich. Along with the bread crumbs, we got", "꿀꺽": "swallowed", "삼켜지고 말았다.": " whole. Gulp!", "광선기의 화면에 마지막 문장이 떠 있었다.": "The last sentence was on the ray gun's screen.", "“축소 효과는 곧 풀립니다. 그전에 몸 밖으로 빠져나가세요.”": "\"The shrinking effect will wear off soon. Get out of the body before then.\"", "몸속에는": "The body holds four rooms in a row:", "소화 → 순환 → 배설 → 호흡": "Digestion → Circulation → Excretion → Breathing", ", 네 개의 방이 이어져 있다. 각 방의 원리를 이해해야 문이 열린다. 짝꿍이 숨을 한 번 크게 내쉬기 전에, 이 몸에서 탈출하자!": ". You must understand each room's principle to open its door. Escape this body before your deskmate takes one big breath out!", "화면": "On the screen,", "왼쪽을 누른 채 밀면": "press and push the left side", "걸어요(손가락 위치에 조이스틱이 나타나요).": " to walk (a joystick appears where your finger is).", "오른쪽을 끌면": "Drag the right side", "둘러보고, 물건과 문은": "to look around, and", "톡 눌러서": "tap", "조사해요.": "objects and doors to examine them.", "태블릿·스마트폰은": "On tablets and phones, it's easier if you rotate to", "가로로 돌려서": "landscape", "하면 더 편해요. 화면이 버벅이면 위쪽": "mode. If the screen lags, open the top", "에서 화질을 낮춰 보세요.": " and lower the graphics quality.", "주운 물건은 오른쪽 아래": "Items you pick up go into the bottom-right", "에 들어가요. 물건을 선택한 뒤 쓸 곳을 터치해요.": ". Select an item, then tap where to use it.", "시점 조작 방향 – 사람에 따라 편한 쪽이 달라요": "Look-control direction – the comfortable way differs by person", "기본 (미는 쪽을 봐요)": "Default (look the way you push)", "반전 (좌우 전환)": "Inverted (swap left/right)", "시작하기": "Start", "1번 방 · 소화": "Room 1 · Digestion", "2번 방 · 순환": "Room 2 · Circulation", "3번 방 · 배설": "Room 3 · Excretion", "4번 방 · 호흡": "Room 4 · Breathing", "관리자 모드 – 시작할 방": "Admin mode – starting room", "관리자 모드 끄기": "Turn off admin mode", "1번 방 – 소화의 방": "Room 1 – Digestion Room", "…눈을 뜬다. 축축하고 붉은 방. 벽이 숨 쉬듯 꿈틀거린다. 천장에서 거대한 이빨이 천천히 오르내린다.": "…You open your eyes. A damp, red room. The walls squirm as if breathing. A giant tooth slowly moves up and down from the ceiling.", "이 몸속에는": "Four rooms are linked inside this body:", "소화, 순환, 배설, 호흡": "digestion, circulation, excretion, breathing.", "네 개의 방이 이어져 있다. 마지막 호흡의 방을 지나야 몸 밖으로 나갈 수 있다.": "You must get through the last room, the breathing room, to leave the body.", "저 멀리": "Far away you see a", "이 보인다. 자물쇠에는 네 자리 숫자 암호가 걸려 있다.": ". The lock holds a four-digit number code.", "이 몸 안에서 탈출해야 한다.": "You have to escape from inside this body.", "눈을 뜬다": "Open your eyes", "호흡의 방 탈출 성공": "Breathing Room Escaped", "몸속에서 탈출했다!": "You escaped from the body!", "짝꿍이 숨을 크게 들이마셨다가 —": "Your deskmate took a deep breath in, and then —", "후우!": "Whoosh!", "우리는 날숨을 타고 입 밖으로 튕겨 나갔다. 데구루루, 샌드위치 포장지 위에 사뿐히 착지.": "We were blown out of the mouth on the exhaled breath. Rolling, rolling, we landed softly on the sandwich wrapper.", "그 순간 몸이 부풀어 오르듯 원래 크기로 돌아왔다. 과학실 책상 앞, 짝꿍이 눈을 깜빡였다. “어? 방금 입속이 간질간질했는데… 숨 쉬기가 이상하게 편해졌어.”": "At that moment our bodies swelled back to normal size. At the science room desk, our deskmate blinked. \"Huh? My mouth was tickly just now… and breathing feels weirdly easy.\"", "선생님이 광선기를 슬며시 서랍에 넣으며 웃으셨다. “자, 오늘 수업은": "The teacher smiled as they slipped the ray gun into a drawer. \"Well, today's lesson is", "동물과 에너지": "Animals and Energy", "다. 방금 너희가 직접 지나온 길 그대로야.”": ". It's exactly the path you just traveled.\"", "걸린 시간": "Time taken", "틀린 횟수": "Mistakes", "힌트 사용": "Hints used", "소화": "Digestion", "침 속 아밀레이스가 녹말을 엿당으로 분해해요. 입에서는 녹말, 위에서는 단백질, 작은창자에서는 지방의 소화가 시작돼요.": "The amylase in saliva breaks starch into maltose. Digestion of starch begins in the mouth, protein in the stomach, and fat in the small intestine.", "혈액 성분": "Blood components", "적혈구는 산소를 운반하고, 백혈구는 세균을 잡아먹고, 혈소판은 피를 굳혀 출혈을 막아요.": "Red blood cells carry oxygen, white blood cells eat bacteria, and platelets clot blood to stop bleeding.", "혈액 순환": "Blood circulation", "온몸순환은 좌심실 → 온몸 → 우심방, 폐순환은 우심실 → 폐 → 좌심방으로 흘러요.": "Systemic circulation flows left ventricle → whole body → right atrium; pulmonary circulation flows right ventricle → lungs → left atrium.", "배설": "Excretion", "콩팥에서 혈액이 여과되고, 포도당처럼 몸에 필요한 물질은 다시 흡수(재흡수)돼요. 남은 노폐물은 오줌이 되어 오줌관을 따라 몸 밖으로 나가요.": "Blood is filtered in the kidney, and substances the body needs, like glucose, are absorbed back (reabsorption). The remaining waste becomes urine and leaves the body through the ureter.", "호흡": "Breathing", "폐에서 산소는 혈액으로 들어오고, 몸에서 생긴 이산화 탄소는 몸 밖으로 나가요.": "In the lungs, oxygen enters the blood, and carbon dioxide made in the body leaves the body.", "이 시험판은 4번 방(호흡의 방)까지 만들었어요.": "This trial version goes up to Room 4 (the Breathing Room).", "다시 해 보기": "Play again", "사다리를 타고 받침대 위로 올라간다.": "You climb the ladder up onto the stand.", "사다리를 타고 아래로 내려간다.": "You climb the ladder down.", "적혈구가 정맥을 타고 올라가다 판막에 막혀 튕겨 나왔다. 정맥의 판막은 피가 거꾸로 흐르지 못하게 막는다. 적혈구는 다시 가방으로 돌아왔다.": "The red blood cell climbed up the vein and was blocked by a valve and bounced back. Valves in veins stop blood from flowing backward. The red blood cell returned to your bag.", "적혈구가 동맥에서 천장의 모세혈관을 지나 정맥을 따라 내려오다 높은 곳에 끼어 있던 심장 조각을 건드렸다. 조각이 바닥으로 떨어졌다.": "The red blood cell went from the artery through the capillaries on the ceiling and down the vein, and touched the heart piece stuck up high. The piece fell to the floor.", "적혈구가 동맥에서 모세혈관을 지나 정맥까지 흘러갔지만 아무 일도 일어나지 않았다. 적혈구는 다시 가방으로 돌아왔다.": "The red blood cell flowed from the artery through the capillaries to the vein, but nothing happened. The red blood cell returned to your bag.", "흡수": "Absorb", "가공된 융털을 이용해 영양소를 흡수하였더니 영양소가 있던 자리에 종이 한 장이 남았다.": "You absorbed the nutrients with the processed villus, and a sheet of paper was left where the nutrients had been.", "시약보관함 방향자물쇠": "Reagent cabinet direction lock", "각 지시약의 방향과 힌트를 연결시켜보세요.": "Connect the direction of each reagent with its clue.", "면을 싫어하는 사람이면 면을 빼버리고 싶지 않을까요?": "If someone doesn't like noodles (면), wouldn't they want to remove the 면?", "시약보관함 침용액": "Saliva solution in the reagent cabinet", "메뉴판을 찾아보세요.": "Look for the menu board.", "각 메뉴들을 따라갔을 때 무엇이 보이는지 확인해보세요.": "Follow each menu item and see what appears.", "가래떡 (녹이기 전)": "Rice cake (before melting)", "녹말을 녹이는 것은 무엇일까요?": "What dissolves starch?", "가래떡 (녹이기 후)": "Rice cake (after melting)", "융털이 흡수를 잘하게 만들려면 어떻게 하면 될까요?": "How could you make the villus absorb better?", "출구 비밀번호": "Exit password", "문장안에서 숫자를 찾아보세요.": "Look for numbers inside the sentence.", "벽에 붙은 숫자 종이": "Number paper on the wall", "기차놀이": "Train game", "끝말잇기": "Word chain", "숫자를 다른 언어로 읽어보세요.": "Read the numbers in another language.", "숫자를 영어로 적어보세요.": "Write the numbers in English.", "적혈구 사용": "Using the red blood cell", "혈관에서 혈액이 흐를 때 어느 방향으로 흐를까요?": "Which direction does blood flow in the vessels?", "노트의 힌트(신조어)": "Hint from the notebook (new slang)", "당신은 L을 가져갈 수 있습니다.": "You can take the L.", "피는 영어로 BLOOD": "Blood in English is BLOOD.", "탈출구 방향열쇠": "Exit direction lock", "이 방안에 탈출을 하기 위한 방법이 적혀있습니다.": "The way to escape is written somewhere in this room.", "산소를 구하는 여정을 떠나 돌아오는 것은, 어떤 순환 과정일까요? 그 길을 따라 가보세요.": "Leaving on a journey to get oxygen and coming back: which circulation is that? Follow that path.", "세그먼트": "Segments", "시간의 흐름을 부수려면 어떤 도구를 사용해야할까요?": "What tool should you use to break the flow of time?", "깨진 숫자를 보았을 때 보이지 않는 부분을 바라보세요.": "When you see the broken numbers, look at the parts you can't see.", "움직이는 책장 (요소 빼내기)": "Moving bookshelf (removing urea)", "책장에서 요소를 빼내야 합니다.": "You must take urea out of the bookshelf.", "책은 26권 있습니다. 26개 있는 것이 무엇일까요?": "There are 26 books. What has 26 of them?", "책의 번호는 각 알파벳에 대응됩니다.": "Each book number corresponds to a letter of the alphabet.", "UREA의 알파벳에 해당하는 책 4권을 빼내야합니다.": "You must take out the 4 books matching the letters of UREA.", "전자현미경 및 요소와 포도당 회수": "Electron microscope & retrieving urea and glucose", "축소광선을 사용해보세요.": "Try using the shrink ray.", "세뇨관 워터슬라이드": "Renal tubule water slide", "탑승하세요": "Climb aboard.", "포도당 위에 올라타세요.": "Get on top of the glucose.", "요소배출장치": "Urea ejector", "요소배출장치로 요소를 발사해 열쇠를 얻은 후 재흡수 되세요.": "Fire the urea with the urea ejector to get the key, then be reabsorbed.", "고무풍선 줍기": "Collecting rubber balloons", "천장에 그려진 지도를 잘 보고 숨은 무언가를 찾아보세요.": "Look closely at the map drawn on the ceiling and find what's hidden.", "왼쪽문": "Left door", "용의 꼬리보다는 뱀의 <b style=\"color:#ff4d4d\">머리</b>가 되겠다.": "I'd rather be the <b style=\"color:#ff4d4d\">head</b> of a snake than the tail of a dragon.", "각 숫자를 영어로 써보세요.": "Write each number in English.", "각 숫자를 영어로 쓴 후, 알파벳 순서를 세어보세요.": "After writing each number in English, count the alphabet positions.", "오른쪽 문": "Right door", "고무 풍선을 폐 모형에 넣어보세요.": "Put the rubber balloons into the lung model.", "<b style=\"color:#ff4d4d\">들</b>짐승과 <b style=\"color:#ff4d4d\">날</b>짐승은 숨을 한번씩 쉬어요.": "Wild beasts (<b style=\"color:#ff4d4d\">들</b>짐승) and flying birds (<b style=\"color:#ff4d4d\">날</b>짐승) each take one breath.", "맞히면 힌트를 받아요.": "Answer correctly to get a hint.", "자물쇠나 기믹을 눌러 본 뒤에 힌트를 쓸 수 있어요.": "You can use a hint after pressing on a lock or gimmick.", "실제 플레이 시간": "Actual play time", "힌트 가산 시간 (1회당 2분)": "Hint penalty (2 min per hint)", "총 소요 시간": "Total time", "실제 플레이 시간 + 힌트 가산 시간": "Actual play time + hint penalty", "문에 답을 직접 적어 넣는 자물쇠가 달려 있다. 벽에 적힌 글을 읽고 공통으로 들어갈 말을 적어 보자.": "The door has a lock where you write the answer yourself. Read the writing on the wall and write the word they have in common.", "안쪽 문의 자물쇠": "Inner door lock", "공통으로 들어갈 말을 쓰시오": "Write the word they have in common.", "문은 굳게 닫혀 있다.": "The door is shut tight.", "소리 크기": "Volume", "서랍 안에 노트가 들어 있다.": "There is a notebook inside the drawer.", "함께 삼켜진 설명서 조각에는 이렇게 적혀 있었다. “축소 효과는 약 한 시간 뒤에 풀립니다. ※ 주의: 좁은 곳에서 풀리면 몹시 곤란합니다.”": "A scrap of the manual, swallowed along with us, read: \"The shrinking effect wears off in about an hour. ※ Caution: it is very awkward if it wears off in a tight space.\"", "남의 몸속에서 원래 크기로 돌아왔다가는 짝꿍도 우리도 큰일이다. 몸속에는 소화 → 순환 → 배설 → 호흡, 네 개의 방이 이어져 있고, 각 방의 원리를 이해해야 문이 열린다. 5교시 종이 울리기 전에 탈출하자!": "If we grow back to full size inside someone else's body, both our deskmate and we are in big trouble. Four rooms lie ahead — Digestion → Circulation → Excretion → Breathing — and each door opens only if you understand how that room works. Escape before the bell rings for fifth period!", "문이 열리자 거센 바람이 몰아쳤다. 짝꿍의 코가 간질간질… “에… 에… 에취!” 우리는 재채기를 타고 총알처럼 튕겨 나가, 칠판지우개 위에 푹신하게 착지했다.": "As the door opened, a fierce wind rushed in. Our deskmate's nose tickled… \"Ah… ah… ACHOO!\" We rode the sneeze out like bullets and landed softly on the chalkboard eraser.", "바로 그 순간 축소 효과가 풀렸다. 펑! 원래 크기로 돌아온 우리를 보고 짝꿍이 눈을 끔뻑였다. “너희 어디 갔었어? 근데 나 방금 샌드위치 먹고 속이 엄청 편해졌어. 누가 안에서 정리라도 해 준 것처럼.”": "At that very moment the shrinking wore off. Pop! Our deskmate blinked at us, back to full size. \"Where did you two go? Anyway, my stomach feels amazing after that sandwich. Like somebody tidied up in there.\"", "선생님이 광선기를 서랍에 넣고 자물쇠까지 채우며 말씀하셨다. “자, 5교시는 동물과 에너지다. 오늘 발표는 직접 다녀온 사람들이 하면 되겠구나.”": "The teacher put the ray gun in a drawer, locked it, and said, \"Now, fifth period is Animals and Energy. Today's presentation can be given by the people who actually went there.\"", "그때 짝꿍의 손이 슬금슬금 서랍 쪽으로 움직였다. “선생님, 근데 이 자물쇠 비밀번호는 뭐예요?”": "Just then, our deskmate's hand crept toward the drawer. \"By the way, teacher, what's the code for this lock?\"", "…눈을 뜬다. 축축하고 붉은 방. 벽이 숨 쉬듯 꿈틀거린다. 천장에서 거대한 이빨이 천천히 오르내린다. 바깥에서 짝꿍의 목소리가 웅웅 울린다. “음~ 역시 참치가 최고야.”": "…You open your eyes. A damp, red room. The walls squirm as if breathing. A giant tooth slowly moves up and down from the ceiling. Our deskmate's voice booms from outside: \"Mmm, tuna really is the best.\"", "…문을 지나자 방이 바뀌었다. 벽 전체가 쿵, 쿵 박동한다. 붉고 푸른 굵은 관들이 벽을 따라 흐르고, 저 멀리 또 하나의 문이 보인다. 그런데 박동이 점점 빨라진다. “헉, 5교시에 수행평가였지?” 짝꿍이 긴장한 모양이다.": "…After passing through the door, the room has changed. The whole wall throbs, thump, thump. Thick red and blue tubes run along the walls, and another door can be seen far away. But the beat keeps getting faster. \"Oh no, there's a test in fifth period!\" Our deskmate seems nervous.", "…문을 지나자 눈이 시릴 만큼 새하얀 방이다. 바닥의 커다란 구멍으로 물이 쉴 새 없이 쏟아져 내려가는 소리가 들린다. 멀리서 짝꿍이 중얼거린다. “아… 화장실 가고 싶다.” 서두르자. 그 길로 나가고 싶지는 않다.": "…Past the door is a dazzlingly white room. You hear water pouring nonstop down a huge hole in the floor. Far away, our deskmate mutters, \"Ugh… I need the bathroom.\" Hurry. That is not the exit we want.", "…관을 기어 나오자 공기가 달라졌다. 분홍빛 방, 천장에는 작은 공기주머니들이 송알송알 매달려 있고, 어디선가 숨 쉬는 소리가 들린다. 이 바람만 잘 타면 밖이다. “하아암~” 짝꿍이 하품을 한다. 5교시가 코앞이다.": "…As you crawl out of the tube, the air feels different. A pink room, with tiny air sacs dangling from the ceiling, and somewhere you can hear breathing. Ride this wind and we're out. \"Yaaawn~\" Our deskmate yawns. Fifth period is almost here.", "점심시간, 과학실. 책상 위에는 선생님이 ‘절대 누르지 마시오’라고 써 붙인 기계가 놓여 있었다. 그리고 샌드위치를 먹던 짝꿍은, 누르지 말라는 건 꼭 눌러 보는 아이였다. 하필 기계는 말리러 다가간 우리 쪽을 향해 있었다. — 번쩍!": "Lunchtime in the science room. On the desk sat a machine the teacher had labeled 'DO NOT PRESS.' And our deskmate, munching on a sandwich, was exactly the kind of kid who presses whatever says not to. Unluckily, the machine was pointed right at us as we rushed over to stop him. — Flash!", "정신을 차려 보니 우리는 빵 부스러기보다 작아져, 짝꿍의 참치 샌드위치 위에 떨어져 있었다. “어? 얘들 어디 갔지? …뭐, 아무 일도 없네.” 짝꿍은 어깨를 으쓱하더니 샌드위치를 크게 한 입 베어 물었다. 꿀꺽.": "When we came to, we were smaller than bread crumbs and had landed on our deskmate's tuna sandwich. \"Huh? Where did they go? …Oh well, nothing happened.\" Our deskmate shrugged and took a big bite of the sandwich. Gulp.", "학생 정보 – 기록은 처음 들어온 기기에 묶여요": "Student info – your record is tied to the first device you join from", "몇 반": "Class", "몇 번":     const pt = el => { const r = el.getBoundingClientRect(); return [r.left - b.left + r.width / 2, r.top - b.top + r.height / 2]; };
    let s = '';
    WIRE_L.forEach(([k, n, c]) => {
      const r = links[k]; if (!r) return;
      const a = pt($(`.wt[data-s="l"][data-k="${k}"] .dot`)), z = pt($(`.wt[data-s="r"][data-k="${r}"] .dot`));
      const col = state === 'bad' ? '#ff4040' : state === 'on' ? '#fff6a0' : c;
      s += `<path d="M${a[0]} ${a[1]} C${a[0] + 70} ${a[1]},${z[0] - 70} ${z[1]},${z[0]} ${z[1]}" fill="none" stroke="${col}" stroke-width="${state === 'on' ? 8 : 6}" stroke-linecap="round"/>`;
    });

    $$('.wt[data-s="r"] .dot').forEach(d => { d.style.background = state === 'on' && Object.values(links).includes(d.parentElement.dataset.k) ? '#fff6a0' : '#0b1018'; });

const ray = new THREE.Raycaster();

const REACH = (id) => id === 'artery' || id === 'vein' ? 9.5 : ['door', 'door2', 'door4', 'ladder', 'ladderUp', 'vent', 'slide', 'pad'].includes(id) ? 6.4 : 5.4;
function interactables() {
  const list = [];
  scene.traverse(o => {
    const id = o.userData && o.userData.id; if (!id || id === 'tongue' || ((id === 'artery' || id === 'vein') && o.isMesh)) return;
    if (id === 'hatch' && !S.lifted) return;

function tap(x, y) {
  camera.updateMatrixWorld(true);
  const r = canvas.getBoundingClientRect();
  ray.setFromCamera(new THREE.Vector2((x - r.left) / r.width * 2 - 1, -((y - r.top) / r.height) * 2 + 1), camera);
  const hits = ray.intersectObjects(scene.children.filter(o => o.type === 'Group'), true);
  for (const h of hits) {
    let o = h.object, vis = true;
    while (o && !(o.userData && o.userData.id)) { if (!o.visible) vis = false; o = o.parent; }
    if (!o || !vis || !o.visible || o.userData.id === 'tongue') continue; /* 바닥(혀)은 터치를 먹지 않고 근처 보정으로 넘김 */
    const wp = new THREE.Vector3(); o.getWorldPosition(wp);
    if (Math.abs((camera.position.y - 1.6) - wp.y) > 8) continue;
    const d = Math.hypot(camera.position.x - wp.x, camera.position.z - wp.z);
    if (d > REACH(o.userData.id)) { toast('너무 멀다. 조금 더 가까이 가 보자.'); return; }
    vibe(); act(o.userData.id, o.userData); return;
  }
  /* 정확히 못 눌렀을 때: 손가락 근처(약 46px)의 가장 가까운 물건을 대신 선택 */
  let best = null, bd = 1e9;
  interactables().forEach(o => {
    const box = new THREE.Box3().setFromObject(o); if (box.isEmpty()) return;
    const c = box.getCenter(new THREE.Vector3());
    if (Math.abs((camera.position.y - 1.6) - c.y) > 8) return;
    if (Math.hypot(camera.position.x - c.x, camera.position.z - c.z) > REACH(o.userData.id)) return;
    const cs = c.clone().applyMatrix4(camera.matrixWorldInverse); if (cs.z > -.2) return;
    const v = c.clone().project(camera);
    const sx = (v.x + 1) / 2 * r.width + r.left, sy = (1 - v.y) / 2 * r.height + r.top;
    const sz = box.getSize(new THREE.Vector3()), rad = Math.max(sz.x, sz.y, sz.z) / 2;
    const px = rad / (Math.abs(cs.z) * Math.tan(camera.fov * Math.PI / 360)) * r.height / 2;
    const dist = Math.hypot(sx - x, sy - y) - Math.min(px, 60);
    if (dist < 46 && dist < bd) { bd = dist; best = o; }
  });
  if (best) { vibe(); act(best.userData.id, best.userData); }
}
